name: Linux validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "configs/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - "environment.yml"
      - ".github/workflows/linux-validation.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YOLO_CONFIG_DIR: ${{ github.workspace }}/.ci-ultralytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install exact v3 framework and project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-v3.txt
          python -m pip install -e . pytest
      - name: Compile Python sources
        run: python -m compileall -q src scripts
      - name: Run tests on Linux
        run: python -m pytest -q
