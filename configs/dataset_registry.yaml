    metadata_status: complete_candidate
    source_config: configs/dataset_registry.yaml
    generation_command: >-
      python scripts\build_grouped_split.py --dataset datasets\blade-v2
      --data datasets\blade-v2\data.yaml --hierarchy configs\class_hierarchy.yaml
      --registry-output results\dataset_registry
      --split-output results\split_candidate
      --manifest-output datasets\blade-v3-grouped
      --hash-inventory results\dataset_registry\image_sha256.csv
      --workers 8 --seed 42
