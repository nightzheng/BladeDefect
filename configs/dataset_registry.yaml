  blade-v3-grouped:
    purpose: grouped_split_candidate
    status: candidate
    source_dataset: blade-v2-full-frozen-48291
    manifest: datasets/blade-v3-grouped/dataset_manifest.json
    image_count: 48291
    instance_count: 49471
    splits:
      train: 33804
      val: 7244
      test: 7243
    split_ratio_target:
      train: 0.70
      val: 0.15
      test: 0.15
