project_root: ../..
model: yolo11s-seg.pt
data: datasets/v3-index-rebuild/blade-v3-grouped-202608/data.yaml
epochs: 200
imgsz: 960
batch: 8
device: auto
# 2026-09-30 联合确认：workers 4→8，纯数据加载吞吐调整，不影响训练口径与结果。
# 依据：V100 节点 GPU 利用率仅 5–48%（iowait 23%），4 workers 读盘+解码+mosaic 供不上。
workers: 8
project: runs
name: v3_yolo11s_seg_960_e200
patience: 0
seed: 42
pretrained: true
cache: false
amp: true
val: true
save: true
save_period: 5
exist_ok: true
label_level: fine
notes: >-
  无泄漏主实验：blade-v3-grouped-202608（15 类），从官方 yolo11s-seg.pt
  重新开始单阶段连续训练 200 轮；patience=0 禁用早停。禁止继承旧全量 split
  或中断 e100 运行的权重。训练只使用 train/val，test 锁定，正式 test 评估
  等待负责人批准。
