schema_version: 1
project_root: ..
output_dir: results/v3_score_sweep

# e200 是已封存基线的历史预算标识，不再作为新实验的默认轮数。
# recommended_from_scratch_epochs 用于未来同口径重训；下列实验均从已封存 best.pt
# 开始一个新的短程微调阶段，不恢复旧 optimizer/scheduler。
tasks:
  seg:
    baseline_run: runs/v3_yolo11s_seg_960_e200
    base_config: configs/experiments/v3_yolo11s_seg_960_e200.yaml
    primary_metric: mask_mAP50-95
    recommended_from_scratch_epochs: 110
    experiments:
      - id: v3_seg_ft_cos_adamw_960_e30
        stage: 1
        hypothesis: 低学习率 AdamW + cosine 在平台后细化边界
        overrides:
          epochs: 30
          imgsz: 960
          batch: 8
          optimizer: AdamW
          lr0: 0.0005
          lrf: 0.01
          cos_lr: true
          warmup_epochs: 2
          weight_decay: 0.0005
          close_mosaic: 10
          patience: 10
      - id: v3_seg_ft_smallobj_1280_e25
        stage: 1
        hypothesis: 1280 输入配合适度 copy-paste/mosaic 提升小目标召回
        overrides:
          epochs: 25
          imgsz: 1280
          batch: 4
          optimizer: AdamW
          lr0: 0.0003
          lrf: 0.01
          cos_lr: true
          warmup_epochs: 2
          weight_decay: 0.0005
          mosaic: 0.7
          copy_paste: 0.15
          scale: 0.6
          close_mosaic: 5
          patience: 8
      - id: v3_seg_ft_aug_960_e30
        stage: 2
        hypothesis: 保持 960，以更温和的几何与实例增强检验泛化收益
        overrides:
          epochs: 30
          imgsz: 960
          batch: 8
          optimizer: AdamW
          lr0: 0.0004
          lrf: 0.01
          cos_lr: true
          warmup_epochs: 2
          mosaic: 0.5
          copy_paste: 0.2
          degrees: 10
          scale: 0.5
          close_mosaic: 10
          patience: 10
      - id: v3_seg_a0_res960_ft_e25
        stage: 1
        hypothesis: 分辨率隔离控制臂：imgsz=960，除 imgsz 外与 A1 完全一致
        overrides:
          imgsz: 960
          epochs: 25
          batch: 4
          optimizer: AdamW
          lr0: 0.0005
          lrf: 0.01
          cos_lr: true
          warmup_epochs: 2
          weight_decay: 0.0005
          mosaic: 1.0
          close_mosaic: 10
          copy_paste: 0.0
          patience: 8
          seed: 42
          workers: 8
      - id: v3_seg_a1_res1280_ft_e25
        stage: 1
        hypothesis: 分辨率隔离实验臂：仅 imgsz=1280，其余与 A0 完全一致
        overrides:
          imgsz: 1280
          epochs: 25
          batch: 4
          optimizer: AdamW
          lr0: 0.0005
          lrf: 0.01
          cos_lr: true
          warmup_epochs: 2
          weight_decay: 0.0005
          mosaic: 1.0
          close_mosaic: 10
          copy_paste: 0.0
          patience: 8
          seed: 42
          workers: 8
      # ── 方案 B：类 10/13/14 定向 copy-paste（Round 3）──────────────────────
      # 前置（缺一不可，否则 preflight 会直接报 data 不存在）：
      #   1. 先跑脚本生成派生数据集：
      #      python scripts/build_class_copy_paste.py --data-yaml <原 data.yaml> \
      #        --out-dir /data/datasets/derived/blade-v3-grouped-202608-cp10_13_14 \
      #        --classes 10,13,14 --copies 3
      #   2. 派生数据集的 val 指回原 val（不泄漏），合成样本只进 train
      # 对照臂 = v3_seg_a0_res960_ft_e25（除 copy-paste 外参数完全一致）
      # 判据（开机前写死，事后不得改）：
      #   ① 类 10/13/14 的 recall Δ 全为正
      #   ② 三类合计漏检率 Δ ≤ -3pt
      #   ③ 总 mAP50-95(M) Δ ≥ -0.002
      #   附加：类 10 单独结论仅作参考不作通过条件（66 实例，列为标注审计重点观察项）
      - id: v3_seg_cp_class13_960_e25
        stage: 1
        hypothesis: 对类 13 定向 copy-paste 过采样，可在不损害其他类的前提下提升类 13 recall 并降低其漏检率
        overrides:
          data: /data/datasets/derived/blade-v3-grouped-202608-b1cp13/data.yaml
          imgsz: 960
          epochs: 25
          batch: 4
          optimizer: AdamW
          lr0: 0.0005
          lrf: 0.01
          cos_lr: true
          warmup_epochs: 2
          weight_decay: 0.0005
          mosaic: 1.0
          close_mosaic: 10
          copy_paste: 0.0
          patience: 8
          seed: 42
          workers: 8

  obb:
    baseline_run: runs/v3_yolo11s_obb_960_e200
    base_config: configs/experiments/v3_yolo11s_obb_960_e200.yaml
    primary_metric: box_mAP50-95
    recommended_from_scratch_epochs: 90
    experiments:
      - id: v3_obb_ft_cos_adamw_960_e30
        stage: 1
        hypothesis: 低学习率 AdamW + cosine 在平台后细化旋转框回归
        overrides:
          epochs: 30
          imgsz: 960
          batch: 8
          optimizer: AdamW
          lr0: 0.0005
          lrf: 0.01
          cos_lr: true
          warmup_epochs: 2
          weight_decay: 0.0005
          close_mosaic: 10
          patience: 10
      - id: v3_obb_ft_smallobj_1280_e25
        stage: 1
        hypothesis: 1280 输入优先改善小目标与细长缺陷定位
        overrides:
          epochs: 25
          imgsz: 1280
          batch: 4
          optimizer: AdamW
          lr0: 0.0003
          lrf: 0.01
          cos_lr: true
          warmup_epochs: 2
          weight_decay: 0.0005
          mosaic: 0.7
          scale: 0.6
          close_mosaic: 5
          patience: 8
      - id: v3_obb_ft_rotation_960_e30
        stage: 2
        hypothesis: 增加旋转与上下翻转增强，改善方向变化大的缺陷
        overrides:
          epochs: 30
          imgsz: 960
          batch: 8
          optimizer: AdamW
          lr0: 0.0004
          lrf: 0.01
          cos_lr: true
          warmup_epochs: 2
          degrees: 45
          translate: 0.1
          scale: 0.5
          fliplr: 0.5
          flipud: 0.5
          mosaic: 0.7
          close_mosaic: 10
          patience: 10

decision_policy:
  minimum_primary_gain: 0.002
  maximum_fps_drop_ratio: 0.20
  maximum_single_class_ap_drop: 0.02
  stage_2_rule: 仅在同任务 stage 1 至少一个实验达到主指标最小增益后运行
  final_rule: 自动排名只做筛选；必须复核逐类指标、混淆矩阵和误检漏检样例后定版
