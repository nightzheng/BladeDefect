name: bladedefect
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  # Keep Conda numerical packages on OpenBLAS so they do not load LLVM OpenMP
  # alongside the Intel OpenMP runtime bundled with pip PyTorch on Windows.
  - "libblas=*=*openblas"
  - numpy
  - pandas
  - pyyaml
  - matplotlib
  - pillow
  - tqdm
  - opencv
  - pytest
  - pip:
      # 正式 v3 baseline 的统一入口会校验此精确版本。
      - ultralytics==8.4.90
      - streamlit
      - gradio
      - rich
